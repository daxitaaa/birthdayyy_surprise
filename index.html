<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💜</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #080b2e, #171044, #32145f);
    color: white;
}

/* ---------- BACKGROUND ---------- */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
}

.glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #7357ff;
    filter: blur(120px);
    opacity: .25;
    animation: glowMove 8s infinite alternate ease-in-out;
}

.glow.one {
    top: -150px;
    left: -100px;
}

.glow.two {
    bottom: -180px;
    right: -100px;
    background: #b45cff;
    animation-delay: 2s;
}

@keyframes glowMove {
    from {
        transform: translate(0,0);
    }
    to {
        transform: translate(100px,60px);
    }
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#bcaaff 1px, transparent 1px);
    background-size: 75px 75px, 120px 120px;
    background-position: 20px 20px, 50px 70px;
    opacity: .3;
}

/* ---------- MAIN ---------- */

.container {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

/* ---------- INTRO ---------- */

.intro {
    animation: introIn 1.5s ease forwards;
}

.intro .tiny {
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #c9c0ff;
    margin-bottom: 20px;
}

.intro h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    line-height: 1.1;
    margin-bottom: 35px;
    text-shadow:
        0 0 15px #8c72ff,
        0 0 35px #6046e8;
}

.surprise-btn {
    border: 1px solid rgba(255,255,255,.3);
    padding: 16px 32px;
    border-radius: 50px;
    color: white;
    font-size: 17px;
    font-weight: 600;
    background: linear-gradient(135deg, #7657ff, #a24eff);
    box-shadow:
        0 0 20px rgba(133,93,255,.5),
        inset 0 0 15px rgba(255,255,255,.15);
    cursor: pointer;
    transition: .3s;
}

.surprise-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px rgba(159,110,255,.8);
}

@keyframes introIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- CAKE SCENE ---------- */

.cakeScene {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: sceneIn 1s ease;
}

@keyframes sceneIn {
    from {
        opacity: 0;
        transform: scale(.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.wish {
    position: absolute;
    top: 9%;
    font-size: clamp(1.2rem, 5vw, 2rem);
    color: #eee8ff;
    text-shadow: 0 0 15px #987eff;
    animation: wishPulse 2s infinite;
}

@keyframes wishPulse {
    50% {
        opacity: .6;
    }
}

/* ---------- CAKE ---------- */

.cakeWrapper {
    position: relative;
    width: 330px;
    height: 300px;
    margin-top: 45px;
}

/* plate */

.plate {
    position: absolute;
    width: 310px;
    height: 35px;
    bottom: 18px;
    left: 10px;
    background: linear-gradient(#dcd7ff,#8177c8);
    border-radius: 50%;
    box-shadow:
        0 10px 20px rgba(0,0,0,.4),
        0 0 25px rgba(160,140,255,.5);
}

/* cake bottom */

.cakeBottom {
    position: absolute;
    width: 230px;
    height: 85px;
    bottom: 45px;
    left: 50px;
    background: linear-gradient(90deg,#7044bd,#a46ae6,#713bb4);
    border-radius: 0 0 22px 22px;
    box-shadow: inset 0 -12px 15px rgba(0,0,0,.15);
}

/* cake top */

.cakeTop {
    position: absolute;
    width: 230px;
    height: 70px;
    bottom: 105px;
    left: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg,#e5c9ff,#a979ed);
    box-shadow:
        0 0 25px rgba(186,139,255,.45),
        inset 0 8px 10px rgba(255,255,255,.3);
}

/* cream drip */

.cream {
    position: absolute;
    width: 230px;
    height: 35px;
    bottom: 105px;
    left: 50px;
    background: #fff5ff;
    border-radius: 50%;
    z-index: 3;
}

.drip {
    position: absolute;
    width: 25px;
    height: 35px;
    background: #fff5ff;
    border-radius: 0 0 20px 20px;
    bottom: 90px;
    z-index: 4;
}

.drip.d1 { left: 85px; height: 45px; }
.drip.d2 { left: 145px; height: 30px; }
.drip.d3 { left: 205px; height: 40px; }

/* cake decorations */

.dot {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ffd6ff;
    bottom: 68px;
    z-index: 5;
    box-shadow: 0 0 8px #fff;
}

.dot.a { left: 90px; }
.dot.b { left: 130px; }
.dot.c { left: 170px; }
.dot.d { left: 210px; }

/* ---------- CANDLES ---------- */

.candles {
    position: absolute;
    bottom: 150px;
    left: 50px;
    width: 230px;
    height: 90px;
    z-index: 10;
}

.candle {
    position: absolute;
    bottom: 0;
    width: 19px;
    height: 65px;
    border-radius: 5px;
    cursor: pointer;
    background:
        repeating-linear-gradient(
            -45deg,
            #fff,
            #fff 7px,
            #9d7aff 7px,
            #9d7aff 14px
        );
    box-shadow: 0 0 10px rgba(255,255,255,.4);
    transition: .2s;
}

.candle:hover {
    transform: translateY(-5px);
}

.candle:nth-child(1) {
    left: 35px;
}

.candle:nth-child(2) {
    left: 105px;
}

.candle:nth-child(3) {
    left: 175px;
}

/* flames */

.flame {
    position: absolute;
    width: 19px;
    height: 29px;
    top: -31px;
    left: 0;
    border-radius: 50% 50% 50% 50%;
    background: #ffd45c;
    box-shadow:
        0 0 8px #fff,
        0 0 18px #ffc400,
        0 0 35px #ff8c00;
    animation: flame 0.5s infinite alternate ease-in-out;
}

@keyframes flame {
    from {
        transform: scale(1) rotate(-3deg);
    }
    to {
        transform: scale(1.15) rotate(4deg);
    }
}

.flame.off {
    opacity: 0;
    transform: scale(0);
    transition: .4s;
}

/* ---------- BALLOONS ---------- */

.balloons {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: 1.5s;
    z-index: 2;
}

.balloons.show {
    opacity: 1;
}

.balloon {
    position: absolute;
    width: 65px;
    height: 82px;
    border-radius: 50% 50% 45% 45%;
    animation: floatBalloon 5s ease-in-out infinite;
    box-shadow:
        inset -12px -10px 20px rgba(0,0,0,.15),
        inset 12px 10px 15px rgba(255,255,255,.25),
        0 0 20px rgba(170,130,255,.35);
}

.balloon::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 120px;
    background: rgba(255,255,255,.35);
    top: 78px;
    left: 50%;
}

.balloon::before {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 27px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid currentColor;
}

.b1 {
    left: 5%;
    top: 12%;
    background: #8b5cf6;
    color: #8b5cf6;
}

.b2 {
    left: 18%;
    top: 65%;
    background: #6366f1;
    color: #6366f1;
    animation-delay: 1s;
}

.b3 {
    right: 7%;
    top: 15%;
    background: #c084fc;
    color: #c084fc;
    animation-delay: 2s;
}

.b4 {
    right: 19%;
    top: 63%;
    background: #818cf8;
    color: #818cf8;
    animation-delay: .5s;
}

.b5 {
    left: 40%;
    top: 7%;
    background: #a78bfa;
    color: #a78bfa;
    animation-delay: 1.5s;
}

.b6 {
    right: 40%;
    top: 75%;
    background: #7c3aed;
    color: #7c3aed;
    animation-delay: 2.5s;
}

@keyframes floatBalloon {
    0%,100% {
        transform: translateY(0) rotate(-3deg);
    }
    50% {
        transform: translateY(-25px) rotate(4deg);
    }
}

/* ---------- FINAL MESSAGE ---------- */

.final {
    display: none;
    position: relative;
    z-index: 10;
    text-align: center;
    animation: finalIn 1.7s cubic-bezier(.17,.67,.3,1.4);
}

.final small {
    display: block;
    font-size: 16px;
    letter-spacing: 5px;
    color: #d7ccff;
    margin-bottom: 20px;
}

.final h2 {
    font-size: clamp(3rem, 13vw, 8rem);
    line-height: .9;
    font-weight: 900;
    color: white;
    text-shadow:
        0 0 8px #fff,
        0 0 18px #e1c7ff,
        0 0 35px #a875ff,
        0 0 65px #774cff,
        0 0 100px #6135e8;
    animation: finalGlow 1.5s infinite alternate;
}

.final .heart {
    font-size: clamp(2rem, 8vw, 4rem);
    margin-top: 25px;
    animation: heartBeat 1s infinite;
}

@keyframes finalIn {
    from {
        opacity: 0;
        transform: scale(.3) rotate(-5deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes finalGlow {
    from {
        filter: brightness(1);
    }
    to {
        filter: brightness(1.3);
    }
}

@keyframes heartBeat {
    50% {
        transform: scale(1.25);
    }
}

/* ---------- CONFETTI ---------- */

.confetti {
    position: fixed;
    width: 8px;
    height: 14px;
    top: -20px;
    z-index: 20;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* ---------- MOBILE ---------- */

@media(max-width:500px) {

    .cakeWrapper {
        transform: scale(.82);
        margin-top: 35px;
    }

    .wish {
        top: 10%;
    }

    .balloon {
        width: 48px;
        height: 62px;
    }

    .balloon::before {
        left: 19px;
    }

    .b5,
    .b6 {
        display: none;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="stars"></div>
</div>

<!-- BALLOONS -->
<div class="balloons" id="balloons">
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="balloon b5"></div>
    <div class="balloon b6"></div>
</div>

<div class="container">

    <!-- FIRST SCREEN -->
    <div class="intro" id="intro">

        <div class="tiny">✨ just for you ✨</div>

        <h1>
            Hey,<br>
            got a little surprise for you 💜
        </h1>

        <button class="surprise-btn" onclick="openSurprise()">
            Open your surprise ✨
        </button>

    </div>


    <!-- CAKE SCREEN -->
    <div class="cakeScene" id="cakeScene">

        <div class="wish">
            Make a wish... ✨
        </div>

        <div class="cakeWrapper">

            <div class="cake">

                <div class="plate"></div>

                <div class="cakeBottom"></div>

                <div class="cakeTop"></div>

                <div class="cream"></div>

                <div class="drip d1"></div>
                <div class="drip d2"></div>
                <div class="drip d3"></div>

                <div class="dot a"></div>
                <div class="dot b"></div>
                <div class="dot c"></div>
                <div class="dot d"></div>

            </div>

            <div class="candles">

                <div class="candle" onclick="blow(this)">
                    <div class="flame"></div>
                </div>

                <div class="candle" onclick="blow(this)">
                    <div class="flame"></div>
                </div>

                <div class="candle" onclick="blow(this)">
                    <div class="flame"></div>
                </div>

            </div>

        </div>

    </div>


    <!-- FINAL SCREEN -->
    <div class="final" id="final">

        <small>✨ TODAY IS YOUR DAY ✨</small>

        <h2>
            HAPPY<br>
            BIRTHDAY<br>
            CUTIE
        </h2>

        <div class="heart">💜</div>

    </div>

</div>


<script>

let blown = 0;

/* OPEN SURPRISE */

function openSurprise() {

    document.getElementById("intro").style.display = "none";

    document.getElementById("cakeScene").style.display = "flex";

}


/* BLOW CANDLE */

function blow(candle) {

    const flame = candle.querySelector(".flame");

    if (flame.classList.contains("off")) return;

    flame.classList.add("off");

    blown++;

    createSparkles(candle);

    if (blown === 3) {

        setTimeout(showBirthday, 1000);

    }
}


/* FINAL BIRTHDAY */

function showBirthday() {

    document.getElementById("cakeScene").style.display = "none";

    document.getElementById("balloons").classList.add("show");

    document.getElementById("final").style.display = "block";

    createConfetti();

    for (let i = 0; i < 30; i++) {

        setTimeout(() => {
            createSparkle();
        }, i * 100);

    }
}


/* SPARKLES */

function createSparkles(element) {

    const rect = element.getBoundingClientRect();

    for (let i = 0; i < 8; i++) {

        const s = document.createElement("div");

        s.innerHTML = ["✨","✦","💜","⭐"][Math.floor(Math.random()*4)];

        s.style.position = "fixed";
        s.style.left = rect.left + Math.random()*40 + "px";
        s.style.top = rect.top + "px";
        s.style.fontSize = "20px";
        s.style.pointerEvents = "none";
        s.style.zIndex = "30";

        document.body.appendChild(s);

        s.animate(
            [
                {
                    opacity: 1,
                    transform: "translateY(0) scale(1)"
                },
                {
                    opacity: 0,
                    transform:
                        `translate(${Math.random()*100-50}px,-100px) scale(1.8)`
                }
            ],
            {
                duration: 1000,
                easing: "ease-out"
            }
        );

        setTimeout(() => s.remove(),1000);
    }
}


/* RANDOM SPARKLES */

function createSparkle() {

    const s = document.createElement("div");

    s.innerHTML = ["✨","💜","⭐","✦"][Math.floor(Math.random()*4)];

    s.style.position = "fixed";
    s.style.left = Math.random()*100 + "vw";
    s.style.top = (40 + Math.random()*50) + "vh";
    s.style.fontSize = (15 + Math.random()*20) + "px";
    s.style.pointerEvents = "none";
    s.style.zIndex = "30";

    document.body.appendChild(s);

    s.animate(
        [
            {
                opacity: 0,
                transform: "scale(.5)"
            },
            {
                opacity: 1,
                transform: "scale(1.5)"
            },
            {
                opacity: 0,
                transform: "scale(.5)"
            }
        ],
        {
            duration: 1600
        }
    );

    setTimeout(() => s.remove(),1600);
}


/* CONFETTI */

function createConfetti() {

    for (let i = 0; i < 100; i++) {

        setTimeout(() => {

            const c = document.createElement("div");

            c.className = "confetti";

            c.style.left = Math.random()*100 + "vw";

            c.style.background =
                ["#a78bfa","#c084fc","#818cf8","#e9d5ff","#ffffff"]
                [Math.floor(Math.random()*5)];

            c.style.animationDuration =
                (3 + Math.random()*4) + "s";

            c.style.transform =
                `rotate(${Math.random()*360}deg)`;

            document.body.appendChild(c);

            setTimeout(() => c.remove(),7000);

        }, i * 35);

    }

}

</script>

</body>
</html>
